<!DOCTYPE html>
<html>
<head>
<title>Writing — Choplogic Radio</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background: #f9f6f0;
    color: #1a1714;
    font-family: calibri, arial, geneva, helvetica, sans-serif;
    margin: 0;
    padding: 20px;
    font-size: 14px;
  }

  body::after {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none; z-index: 100;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 180px 180px;
    line-height: 1.6;
  }

  a { color: #000080; }
  a:visited { color: #666666; }
  a:hover { color: #800000; }

  .wrap { max-width: 900px; margin: 0 auto; }

  .nav {
    font-size: 12px;
    margin-bottom: 20px;
  }
  .nav a { color: #666; text-decoration: none; margin-right: 16px; }
  .nav a:hover { text-decoration: underline; }
  .nav a.active { color: #000; font-weight: bold; }

  h1 {
    font-family: Garamond, Georgia, serif;
    font-size: 28px;
    font-weight: normal;
    margin: 0 0 24px 0;
  }

  .writing-table {
    width: 100%;
    border-collapse: collapse;
    background: #000000;
    margin-bottom: 30px;
  }

  .writing-table td {
    padding: 8px 10px;
    vertical-align: top;
  }

  .writing-header td {
    background: #2f2f4f;
    color: #ffff00;
    font-weight: bold;
    font-size: 13px;
    padding: 5px 10px;
  }

  .writing-row td {
    background: #f9f6f0;
    border-bottom: 1px solid #e0e0e0;
    font-size: 13px;
  }

  .writing-row td:first-child {
    width: 80px;
    color: #999;
    white-space: nowrap;
  }

  .writing-row td:nth-child(2) {
    font-weight: bold;
  }

  .writing-row td:nth-child(3) {
    color: #666;
    font-style: italic;
  }

  .footer {
    margin-top: 40px;
    padding-top: 10px;
    border-top: 1px solid #ccc;
    font-size: 11px;
    color: #999;
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="chop-nav"></div>
  <script src="/js/chop-nav.js"></script>

  <h1>Writing</h1>

  <table class="writing-table" cellpadding="4" cellspacing="1">
    <tr class="writing-header"><td>Year</td><td>Title</td><td>Publication</td></tr>
    <tr class="writing-row">
      <td>2005</td>
      <td>Psychoanalysis and culture</td>
      <td><a href="https://muse.jhu.edu/journal/147">American Imago</a>, Vol. 62 No. 1 — Johns Hopkins University Press</td>
    </tr>
    <tr class="writing-row">
      <td>2014</td>
      <td><a href="https://medium.com/@j.avalos">Thoughts on the State of Lawyers and Legal Practice</a></td>
      <td>Medium</td>
    </tr>
  </table>

  <p style="color:#999; font-size:13px; font-style:italic;">More writing to be added. Check <a href="https://medium.com/@j.avalos">Medium</a> for recent posts.</p>

  <div class="footer">
    &copy; Choplogic Radio. Est. 2006. chopradio@gmail.com
  </div>

</div>
</body>
</html>
