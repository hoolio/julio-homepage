<!DOCTYPE html>
<html>
<head>
<title>Julio Avalos — Choplogic Radio</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Julio Avalos — writer, broadcaster, host of Choplogic Radio. Est. 2006.">
<style>
  html {
    background:
      radial-gradient(ellipse 1400px 900px at 50% 0%, rgba(160, 120, 40, 0.07), transparent 70%),
      radial-gradient(ellipse 1100px 700px at 80% 40%, rgba(140, 110, 50, 0.05), transparent 65%),
      #f0ebe1;
    background-attachment: fixed;
    scroll-behavior: smooth;
  }
  body {
    background: transparent;
    color: #1a1714;
    font-family: calibri, arial, geneva, helvetica, sans-serif;
    margin: 0;
    padding: 0;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    opacity: 0.08;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='6' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 220px 220px;
    mix-blend-mode: multiply;
  }

  a { color: #333; }
  a:hover { color: #800000; }

  .main {
    max-width: 640px;
    margin: 0 auto;
    padding: 80px 20px 60px;
    text-align: center;
  }

  .portrait {
    width: 200px;
    height: auto;
    margin-bottom: 40px;
    filter: contrast(1.05) brightness(1.02);
    mix-blend-mode: multiply;
    transition: filter 0.5s ease, transform 0.5s ease;
  }
  .portrait:hover {
    filter: contrast(1.08) brightness(1.04);
    transform: scale(1.015);
  }

  h1 {
    font-family: Garamond, Georgia, serif;
    font-size: 46px;
    font-weight: normal;
    letter-spacing: 0.06em;
    margin: 0 0 10px 0;
    color: #1a1714;
    text-transform: lowercase;
  }

  .tagline {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 11px;
    font-style: normal;
    color: #a89c80;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 50px;
  }

  .divider {
    width: 28px;
    height: 1.5px;
    background: #6a1e1a;
    margin: 0 auto 40px;
    opacity: 0.4;
  }

  .links-table {
    width: 100%;
    max-width: 480px;
    margin: 0 auto 50px;
    border-collapse: collapse;
    text-align: left;
  }

  .links-table td {
    padding: 10px 0;
    border-bottom: 1px solid rgba(0,0,0,0.04);
    font-family: Garamond, Georgia, serif;
    font-size: 16px;
  }

  .links-table td:first-child {
    width: 120px;
    color: #b4a98f;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    vertical-align: top;
    padding-top: 15px;
  }
  .links-table .link-ico {
    display: inline-block;
    width: 11px;
    height: 11px;
    vertical-align: -1px;
    margin-right: 5px;
    opacity: 0.35;
    transition: opacity 0.3s;
  }
  tr:hover .link-ico { opacity: 0.6; }

  .links-table a {
    color: #1a1714;
    text-decoration: none;
    border-bottom: 1px solid rgba(0,0,0,0.1);
    transition: border-color 0.2s, color 0.2s;
  }

  .links-table a:hover {
    border-color: #800000;
    color: #800000;
  }

  /* Inline contact form */
  .contact-form {
    display: flex;
    align-items: center;
    gap: 0;
    width: 100%;
  }
  .contact-input {
    flex: 1;
    font: inherit;
    font-size: 14px;
    color: #1a1714;
    background: none;
    border: none;
    border-bottom: 1px solid rgba(0,0,0,0.1);
    padding: 4px 0;
    outline: none;
    transition: border-color 0.3s ease;
  }
  .contact-input::placeholder {
    color: #bbb;
    font-style: italic;
  }
  .contact-input:focus {
    border-color: #6a1e1a;
  }
  .contact-send {
    background: none;
    border: 1px solid rgba(0,0,0,0.12);
    color: #aaa;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    padding: 5px 10px;
    margin-left: 8px;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
    flex-shrink: 0;
  }
  .contact-send:hover {
    color: #6a1e1a;
    border-color: rgba(106, 30, 26, 0.4);
    background: rgba(106, 30, 26, 0.03);
  }
  .contact-send:active {
    transform: scale(0.96);
  }
  .contact-sent {
    font-size: 13px;
    color: #6a1e1a;
    font-style: italic;
    display: none;
  }

  .links-table .works-row td { border-bottom: 1px solid rgba(0,0,0,0.06); }
  .works-link {
    font-size: 16px;
    color: #6a1e1a;
    text-decoration: none;
    border-bottom: 1px solid rgba(106, 30, 26, 0.35);
    transition: border-color 0.3s ease, color 0.3s ease, letter-spacing 0.3s ease;
  }
  .works-link:hover {
    color: #800000;
    border-color: #800000;
    letter-spacing: 0.01em;
  }

  /* ---------- Timeline ---------- */
  .timeline {
    max-width: 760px;
    margin: 0 auto 60px;
    padding: 60px 20px 20px;
    position: relative;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 44px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      #6a1e1a 4px,
      #6a1e1a 18px,
      transparent 20px,
      transparent 24px,
      #6a1e1a 26px,
      #6a1e1a 50px,
      transparent 52px
    );
    opacity: 0.3;
    mask-image: linear-gradient(to bottom, transparent, black 80px, black calc(100% - 80px), transparent);
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 80px, black calc(100% - 80px), transparent);
  }
  .timeline::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 3px,
      rgba(26, 23, 20, 0.012) 3px,
      rgba(26, 23, 20, 0.012) 4px
    );
  }

  /* --- Node entrance --- */
  .tl-node {
    position: relative;
    padding-left: 76px;
    padding-bottom: 72px;
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .tl-node.visible {
    opacity: 1;
    transform: translateY(0);
  }
  /* Stagger children */
  .tl-node .tl-year {
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s ease 0.1s, transform 0.5s ease 0.1s;
  }
  .tl-node .tl-label {
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s ease 0.18s, transform 0.5s ease 0.18s;
  }
  .tl-node .tl-narrative {
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s ease 0.26s, transform 0.5s ease 0.26s;
  }
  .tl-node .tl-cards {
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.6s ease 0.38s, transform 0.6s ease 0.38s;
  }
  .tl-node.visible .tl-year,
  .tl-node.visible .tl-label,
  .tl-node.visible .tl-narrative,
  .tl-node.visible .tl-cards {
    opacity: 1;
    transform: translateY(0);
  }

  /* --- Pip --- */
  .tl-pip {
    position: absolute;
    left: 40px;
    top: 8px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: none;
    border: 1.5px solid #6a1e1a;
    z-index: 1;
    transform: scale(0);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s;
    opacity: 0.6;
  }
  .tl-node.visible .tl-pip {
    transform: scale(1);
  }

  .tl-year {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.24em;
    color: #6a1e1a;
    margin-bottom: 6px;
    opacity: 0.7;
  }
  .tl-label {
    font-family: Garamond, Georgia, serif;
    font-size: 28px;
    font-weight: normal;
    font-style: italic;
    color: #1a1714;
    letter-spacing: 0.01em;
    margin: 0 0 14px 0;
    position: relative;
  }
  .tl-label::after {
    content: '';
    display: block;
    width: 20px;
    height: 1px;
    background: #6a1e1a;
    margin-top: 10px;
    opacity: 0.35;
  }
  .tl-narrative {
    font-family: Garamond, Georgia, serif;
    font-size: 16px;
    line-height: 1.75;
    color: #3a342c;
    max-width: 540px;
    margin-bottom: 22px;
    letter-spacing: 0.005em;
  }
  .tl-narrative em {
    font-style: italic;
    color: #1a1714;
  }
  .tl-narrative a {
    color: #6a1e1a;
    text-decoration: none;
    border-bottom: 1px solid rgba(106, 30, 26, 0.25);
    transition: border-color 0.3s, color 0.3s;
  }
  .tl-narrative a:hover { border-color: #6a1e1a; color: #800000; }

  .tl-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(105px, 110px));
    gap: 22px 14px;
    margin-top: 12px;
    justify-content: start;
  }
  .tl-cards .work-card {
    width: 100%;
  }

  .work-card {
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .work-thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    background: #ece6da;
    overflow: hidden;
    border: none;
    outline: 1px solid rgba(26, 23, 20, 0.1);
    outline-offset: -1px;
    transition: transform 0.25s ease, box-shadow 0.3s ease, filter 0.3s ease;
    transform-origin: center;
  }
  .work-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: contrast(1.04) brightness(1.01);
    mix-blend-mode: multiply;
  }
  .work-thumb .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px;
    text-align: center;
    background:
      radial-gradient(ellipse at top, rgba(196,125,40,0.08), transparent 70%),
      #f3ede1;
  }
  .work-thumb .placeholder .ph-kicker {
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #b4a98f;
    margin-bottom: 10px;
  }
  .work-thumb .placeholder .ph-title {
    font-family: Garamond, Georgia, serif;
    font-size: 17px;
    line-height: 1.25;
    color: #3a342c;
  }
  .work-thumb .placeholder .ph-rule {
    width: 24px;
    height: 1px;
    background: #c9bfa8;
    margin: 12px 0;
  }
  .work-thumb .placeholder .ph-meta {
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #a89c80;
  }

  /* SVG art card variant — Interviews/Writings */
  .work-thumb .art-thumb {
    position: absolute;
    inset: 0;
    display: block;
  }
  .work-thumb .art-thumb svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* logo card variant for Work tab */
  .work-thumb.logo-thumb {
    background:
      radial-gradient(ellipse at top, rgba(196,125,40,0.06), transparent 70%),
      #f3ede1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .work-thumb .logo-mark {
    width: 60%;
    height: 50%;
    background-color: #2c2620;
    -webkit-mask-position: center;
            mask-position: center;
    -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
    -webkit-mask-size: contain;
            mask-size: contain;
    transition: background-color 0.3s ease;
  }
  .work-card:hover .logo-mark { background-color: #6a1e1a; }
  .work-thumb .logo-meta {
    margin-top: 18px;
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #a89c80;
    text-align: center;
  }

  /* Card hover — layered shadows, smooth lift */
  .work-card {
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .work-card:hover {
    transform: translateY(-3px);
  }
  .work-card:active {
    transform: translateY(0) scale(0.98);
    transition-duration: 0.1s;
  }
  .work-thumb {
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.3s ease;
    box-shadow:
      0 1px 2px rgba(26, 23, 20, 0.06),
      0 2px 6px rgba(26, 23, 20, 0.04);
  }
  .work-card:hover .work-thumb {
    box-shadow:
      0 0 0 1px rgba(106, 30, 26, 0.18),
      0 4px 12px rgba(106, 30, 26, 0.12),
      0 12px 32px rgba(106, 30, 26, 0.16),
      0 20px 48px rgba(106, 30, 26, 0.08);
    filter: brightness(1.03) contrast(1.02);
  }
  .work-card:focus-visible .work-thumb {
    outline: 2px solid #6a1e1a;
    outline-offset: 3px;
  }

  .work-meta {
    text-align: center;
    line-height: 1.4;
    transition: opacity 0.3s ease;
  }
  .work-card:hover .work-meta { opacity: 0.85; }
  .work-meta .wm-title {
    font-family: Garamond, Georgia, serif;
    font-size: 13.5px;
    font-style: italic;
    color: #3a342c;
    display: block;
  }
  .work-meta .wm-sub {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: #b4a98f;
    margin-top: 3px;
    display: block;
  }

  /* ---------- Modal / lightbox ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 17, 14, 0);
    -webkit-backdrop-filter: blur(0px);
            backdrop-filter: blur(0px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    opacity: 0;
    visibility: hidden;
    transition:
      opacity 0.45s ease,
      background-color 0.45s ease,
      backdrop-filter 0.45s ease,
      -webkit-backdrop-filter 0.45s ease,
      visibility 0s linear 0.45s;
  }
  .modal-backdrop.open {
    opacity: 1;
    visibility: visible;
    background: rgba(20, 17, 14, 0.78);
    -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
    transition:
      opacity 0.45s ease,
      background-color 0.45s ease,
      backdrop-filter 0.45s ease,
      -webkit-backdrop-filter 0.45s ease,
      visibility 0s linear 0s;
  }
  .modal {
    background: #f9f6f0;
    max-width: 880px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 30px 90px rgba(0,0,0,0.55), 0 8px 24px rgba(0,0,0,0.25);
    position: relative;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(28px) scale(0.97);
    transition:
      opacity 0.45s ease,
      transform 0.55s cubic-bezier(0.18, 1, 0.32, 1);
  }
  .modal-backdrop.open .modal {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  @media (prefers-reduced-motion: reduce) {
    .modal-backdrop, .modal-backdrop .modal {
      transition: opacity 0.15s ease, visibility 0s linear 0.15s;
      transform: none !important;
    }
    .modal-backdrop.open { transition: opacity 0.15s ease; }
    .tl-node, .tl-node .tl-year, .tl-node .tl-label,
    .tl-node .tl-narrative, .tl-node .tl-cards, .tl-pip {
      transition: none !important;
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
  .modal-close {
    position: absolute;
    top: 12px;
    right: 14px;
    background: none;
    border: 0;
    color: #1a1714;
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
    padding: 6px 10px;
    z-index: 2;
    opacity: 0.6;
    transition: opacity 0.2s;
  }
  .modal-close:hover { opacity: 1; }

  .modal-image-wrap {
    position: relative;
    background: #1a1714;
    aspect-ratio: 4 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .modal-image-wrap img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }
  .modal-image-wrap .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
    background:
      radial-gradient(ellipse at top, rgba(196,125,40,0.10), transparent 70%),
      #f3ede1;
    color: #3a342c;
  }
  .modal-image-wrap .placeholder .ph-kicker {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #b4a98f;
    margin-bottom: 16px;
  }
  .modal-image-wrap .placeholder .ph-title {
    font-family: Garamond, Georgia, serif;
    font-size: 32px;
    line-height: 1.2;
    max-width: 600px;
  }
  .modal-image-wrap .placeholder .ph-rule {
    width: 36px;
    height: 1px;
    background: #c9bfa8;
    margin: 18px 0;
  }
  .modal-image-wrap .placeholder .ph-meta {
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #a89c80;
  }
  .modal-image-wrap .modal-logo .logo-mark {
    width: 200px;
    height: 200px;
    background-color: #6a1e1a;
    -webkit-mask-position: center;
            mask-position: center;
    -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
    -webkit-mask-size: contain;
            mask-size: contain;
  }
  .modal-image-wrap.art-mode {
    background: #f3ede1;
    aspect-ratio: 4 / 3;
  }
  .modal-image-wrap .modal-art {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-image-wrap .modal-art svg {
    height: 100%;
    width: auto;
    max-width: 100%;
    display: block;
  }

  .modal-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(249, 246, 240, 0.85);
    border: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    color: #1a1714;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .modal-nav:hover { background: #fff; }
  .modal-nav.prev { left: 14px; }
  .modal-nav.next { right: 14px; }
  .modal-nav[hidden] { display: none; }

  .modal-body {
    padding: 28px 36px 32px;
  }
  .modal-kicker {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #aaa;
    margin-bottom: 8px;
  }
  .modal-title {
    font-family: Garamond, Georgia, serif;
    font-size: 26px;
    font-weight: normal;
    margin: 0 0 14px 0;
    color: #1a1714;
    letter-spacing: 0.02em;
  }
  .modal-caption {
    font-size: 14px;
    line-height: 1.65;
    color: #3a342c;
    margin-bottom: 20px;
  }
  .modal-link {
    display: inline-block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #6a1e1a;
    text-decoration: none;
    border-bottom: 1px solid rgba(106,30,26,0.4);
    padding-bottom: 2px;
    transition: border-color 0.2s;
  }
  .modal-link:hover { border-color: #6a1e1a; }
  .modal-counter {
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #c0b8a8;
    margin-top: 18px;
  }

  @media (max-width: 580px) {
    .main { padding: 50px 18px 40px; }
    h1 { font-size: 30px; }
    .timeline { padding: 40px 10px 10px; }
    .timeline::before { left: 24px; }
    .tl-node { padding-left: 52px; }
    .tl-pip { left: 18px; }
    .tl-label { font-size: 22px; }
    .tl-narrative { font-size: 15.5px; }
    .tl-cards { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 16px 10px; }
    .modal-body { padding: 22px 22px 28px; }
    .modal-title { font-size: 22px; }
  }

  .footer-art-wrap {
    position: relative;
    max-width: 520px;

  function spawnDeer() {
    const spirit = document.createElement('div');
    spirit.className = 'deer-spirit';
    const size = 28 + Math.random() * 20; // 28–48px
    const pose = DEER_POSES[Math.floor(Math.random() * DEER_POSES.length)];
    const x = 5 + Math.random() * 90; // 5–95vw
    const fallDur = 30 + Math.random() * 40; // 30–70s — slow, leisurely
    const spinDur = 12 + Math.random() * 20; // 12–32s full rotation
    const spinDir = Math.random() > 0.5 ? '360deg' : '-360deg';
    const color = Math.random() > 0.4 ? '#1a1714' : '#6a1e1a';
    const opacity = 0.15 + Math.random() * 0.12; // 0.15–0.27
    const delay = Math.random() * -fallDur; // stagger across the cycle

    spirit.innerHTML = `<div class="deer-spirit-inner" style="--spin-dur:${spinDur}s;--spin-dir:${spinDir}">${pose}</div>`;
    spirit.style.cssText = `
      left: ${x}vw;
      width: ${size}px;
      color: ${color};
      --deer-op: ${opacity};
      animation: deerFall ${fallDur}s linear ${delay}s infinite;
    `;
    deerField.appendChild(spirit);
  }

  // Few and far between — just enough to be delightful
  const deerCount = window.innerWidth < 580 ? 4 : 7;
  for (let i = 0; i < deerCount; i++) spawnDeer();

  // -------- Footer art reveal --------
  const footerArt = document.getElementById('footerArt');
  if (footerArt) {
    const footerObs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          footerArt.classList.add('revealed');
          footerObs.unobserve(footerArt);
        }
      });
    }, { threshold: 0.05, rootMargin: '0px 0px 100px 0px' });
    footerObs.observe(footerArt);
  }

  // -------- Contact form --------
  const contactForm = document.getElementById('contactForm');
  const contactMsg = document.getElementById('contactMsg');
  const contactSent = document.getElementById('contactSent');
  // Lightly obfuscated to keep out of plain-text scrapers
  const _u = ['chopradio', 'gmail.com'].join('@');
  contactForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const msg = contactMsg.value.trim();
    if (!msg) { contactMsg.focus(); return; }
    const subj = encodeURIComponent('Homepage inquiry — chopradio.com');
    const body = encodeURIComponent(msg + '\n\n— Sent from chopradio.com');
    window.location.href = `mailto:${_u}?subject=${subj}&body=${body}`;

    contactForm.style.display = 'none';
    contactSent.style.display = 'inline';
    haptic('medium');
    setTimeout(() => {
      contactForm.style.display = '';
      contactSent.style.display = 'none';
      contactMsg.value = '';
    }, 4000);
