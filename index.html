<style>
  html, body { overflow-x: hidden; }
  body {
    background: #f9f6f0;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: 'Calibri', Arial, sans-serif;
    color: #1a1714;
  }

  body::after {

    position: fixed;

    pointer-events: none;

  .splash {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    cursor: pointer;
  }

  h1 {
    font-family: Garamond, Georgia, serif;
    font-size: clamp(1.8rem, 8vw, 3.2rem);
    font-weight: normal;
    color: #1a1714;
    margin: 0 0 2rem 0;
    letter-spacing: 0.04em;
    text-align: center;
    max-width: 100%;
    word-wrap: break-word;
  }

  img.deer {
    max-width: 480px;
    width: 85%;
    height: auto;
    filter: contrast(1.05) brightness(1.02);
    mix-blend-mode: multiply;
    display: block;
  }

  .splash a.enter { display: block; }

  .est {
    margin-top: 2.5rem;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #bbb;
  }

  footer {
    padding: 18px 22px;
    border-top: 1px solid rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8580;
    flex-wrap: wrap;
    background: rgba(249, 246, 240, 0.9);
    cursor: default;
  }
  footer .who { color: #1a1714; font-weight: 600; letter-spacing: 0.14em; }
  footer .links { display: flex; gap: 14px; margin-left: auto; flex-wrap: wrap; align-items: center; }
  footer a {
    color: #5a534a;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 2px;
    transition: color 0.25s ease, text-shadow 0.3s ease;
  }
  footer a:hover {
    color: #6a1e1a;
    text-shadow: 0 0 12px rgba(106, 30, 26, 0.25);
  }
  footer svg { width: 14px; height: 14px; opacity: 0.8; }
  footer a:hover svg { opacity: 1; }

  @media (max-width: 580px) {
    footer { padding: 14px 16px; font-size: 9px; gap: 10px; flex-direction: column; align-items: flex-start; }
    footer .links { margin-left: 0; gap: 12px; }
  }
</style>
