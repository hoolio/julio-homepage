<!DOCTYPE html>
<html>
<head>
<title>Julio Avalos — Choplogic Radio</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Julio Avalos — writer, broadcaster, host of Choplogic Radio. Est. 2006.">
<style>
  html {
    background:
      radial-gradient(ellipse 1400px 900px at 50% 0%, rgba(196, 125, 40, 0.055), transparent 70%),
      radial-gradient(ellipse 1100px 700px at 80% 40%, rgba(160, 120, 40, 0.04), transparent 65%),
      #f9f6f0;
    background-attachment: fixed;
  }
  body {
    background: transparent;
    color: #1a1714;
    font-family: calibri, arial, geneva, helvetica, sans-serif;
    margin: 0;
    padding: 0;
    font-size: 14px;
    line-height: 1.6;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 180px 180px;
  }

  a { color: #333; }
  a:hover { color: #800000; }

  .main {
    max-width: 640px;
    margin: 0 auto;
    padding: 80px 20px 60px;
    text-align: center;
  }

  .portrait {
    width: 200px;
    height: auto;
    margin-bottom: 40px;
    filter: contrast(1.05) brightness(1.02);
    mix-blend-mode: multiply;
  }

  h1 {
    font-family: Garamond, Georgia, serif;
    font-size: 36px;
    font-weight: normal;
    letter-spacing: 0.04em;
    margin: 0 0 12px 0;
    color: #1a1714;
  }

  .tagline {
    font-family: Garamond, Georgia, serif;
    font-size: 16px;
    font-style: italic;
    color: #888;
    margin-bottom: 50px;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: #ccc;
    margin: 0 auto 40px;
  }

  .links-table {
    width: 100%;
    max-width: 420px;
    margin: 0 auto 50px;
    border-collapse: collapse;
    text-align: left;
  }

  .links-table td {
    padding: 8px 0;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    font-size: 13px;
  }

  .links-table td:first-child {
    width: 100px;
    color: #aaa;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    vertical-align: top;
    padding-top: 10px;
  }

  .links-table a {
    color: #1a1714;
    text-decoration: none;
    border-bottom: 1px solid rgba(0,0,0,0.1);
    transition: border-color 0.2s, color 0.2s;
  }

  .links-table a:hover {
    border-color: #800000;
    color: #800000;
  }

  .links-table .works-row td { border-bottom: 1px solid rgba(0,0,0,0.06); }
  .works-toggle {
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    font: inherit;
    font-size: 13px;
    color: #6a1e1a;
    cursor: pointer;
    border-bottom: 1px solid rgba(106, 30, 26, 0.35);
    transition: border-color 0.2s, color 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .works-toggle:hover { color: #800000; border-color: #800000; }
  .works-toggle .chev {
    display: inline-block;
    transition: transform 0.3s ease;
    font-size: 9px;
    color: #6a1e1a;
  }
  .works-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }

  /* ---------- Works gallery ---------- */
  .works {
    max-width: 880px;
    margin: 0 auto 60px;
    padding: 0 20px;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.5s ease, opacity 0.4s ease, margin 0.4s ease;
  }
  .works.open {
    max-height: 4000px;
    opacity: 1;
  }
  .works-inner {
    border-top: 1px solid rgba(0,0,0,0.08);
    padding-top: 32px;
  }

  .works-tabs {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .works-tab {
    background: none;
    border: 0;
    padding: 6px 2px;
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: #aaa;
    cursor: pointer;
    border-bottom: 1px solid transparent;
    transition: color 0.2s, border-color 0.2s;
  }
  .works-tab:hover { color: #1a1714; }
  .works-tab.active {
    color: #1a1714;
    border-bottom-color: #6a1e1a;
  }

  .works-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 26px;
    padding-bottom: 20px;
  }

  .work-card {
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .work-thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    background: #ece6da;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);
    transition: transform 0.25s ease, box-shadow 0.3s ease, filter 0.3s ease;
    transform-origin: center;
  }
  .work-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: contrast(1.04) brightness(1.01);
    mix-blend-mode: multiply;
  }
  .work-thumb .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px;
    text-align: center;
    background:
      radial-gradient(ellipse at top, rgba(196,125,40,0.08), transparent 70%),
      #f3ede1;
  }
  .work-thumb .placeholder .ph-kicker {
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #b4a98f;
    margin-bottom: 10px;
  }
  .work-thumb .placeholder .ph-title {
    font-family: Garamond, Georgia, serif;
    font-size: 17px;
    line-height: 1.25;
    color: #3a342c;
  }
  .work-thumb .placeholder .ph-rule {
    width: 24px;
    height: 1px;
    background: #c9bfa8;
    margin: 12px 0;
  }
  .work-thumb .placeholder .ph-meta {
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #a89c80;
  }

  /* SVG art card variant — Interviews/Writings */
  .work-thumb .art-thumb {
    position: absolute;
    inset: 0;
    display: block;
  }
  .work-thumb .art-thumb svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* logo card variant for Work tab */
  .work-thumb.logo-thumb {
    background:
      radial-gradient(ellipse at top, rgba(196,125,40,0.06), transparent 70%),
      #f3ede1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .work-thumb .logo-mark {
    width: 60%;
    height: 50%;
    background-color: #2c2620;
    -webkit-mask-position: center;
            mask-position: center;
    -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
    -webkit-mask-size: contain;
            mask-size: contain;
    transition: background-color 0.3s ease;
  }
  .work-card:hover .logo-mark { background-color: #6a1e1a; }
  .work-thumb .logo-meta {
    margin-top: 18px;
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #a89c80;
    text-align: center;
  }

  /* subtle nudge + oxblood glow on hover */
  @keyframes jiggle {
    0%, 100% { transform: rotate(0deg) translateY(-1px); }
    35%      { transform: rotate(-0.5deg) translateY(-1px); }
    70%      { transform: rotate(0.4deg) translateY(-1px); }
  }
  .work-card:hover .work-thumb {
    box-shadow:
      0 0 0 1px rgba(106, 30, 26, 0.32),
      0 10px 28px rgba(106, 30, 26, 0.28),
      0 18px 50px rgba(106, 30, 26, 0.18);
    filter: brightness(1.03);
    animation: jiggle 0.7s ease-in-out;
  }
  .work-card:focus-visible .work-thumb {
    outline: 2px solid #6a1e1a;
    outline-offset: 3px;
  }

  .work-meta {
    text-align: center;
    line-height: 1.4;
  }
  .work-meta .wm-title {
    font-family: Garamond, Georgia, serif;
    font-size: 15px;
    color: #1a1714;
    display: block;
  }
  .work-meta .wm-sub {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #aaa;
    margin-top: 3px;
    display: block;
  }

  /* ---------- Modal / lightbox ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 17, 14, 0.78);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .modal-backdrop.open {
    display: flex;
    opacity: 1;
  }
  .modal {
    background: #f9f6f0;
    max-width: 880px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 80px rgba(0,0,0,0.5);
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .modal-close {
    position: absolute;
    top: 12px;
    right: 14px;
    background: none;
    border: 0;
    color: #1a1714;
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
    padding: 6px 10px;
    z-index: 2;
    opacity: 0.6;
    transition: opacity 0.2s;
  }
  .modal-close:hover { opacity: 1; }

  .modal-image-wrap {
    position: relative;
    background: #1a1714;
    aspect-ratio: 4 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .modal-image-wrap img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }
  .modal-image-wrap .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
    background:
      radial-gradient(ellipse at top, rgba(196,125,40,0.10), transparent 70%),
      #f3ede1;
    color: #3a342c;
  }
  .modal-image-wrap .placeholder .ph-kicker {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #b4a98f;
    margin-bottom: 16px;
  }
  .modal-image-wrap .placeholder .ph-title {
    font-family: Garamond, Georgia, serif;
    font-size: 32px;
    line-height: 1.2;
    max-width: 600px;
  }
  .modal-image-wrap .placeholder .ph-rule {
    width: 36px;
    height: 1px;
    background: #c9bfa8;
    margin: 18px 0;
  }
  .modal-image-wrap .placeholder .ph-meta {
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #a89c80;
  }
  .modal-image-wrap .modal-logo .logo-mark {
    width: 200px;
    height: 200px;
    background-color: #6a1e1a;
    -webkit-mask-position: center;
            mask-position: center;
    -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
    -webkit-mask-size: contain;
            mask-size: contain;
  }
  .modal-image-wrap.art-mode {
    background: #f3ede1;
    aspect-ratio: 4 / 3;
  }
  .modal-image-wrap .modal-art {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-image-wrap .modal-art svg {
    height: 100%;
    width: auto;
    max-width: 100%;
    display: block;
  }

  .modal-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(249, 246, 240, 0.85);
    border: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    color: #1a1714;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .modal-nav:hover { background: #fff; }
  .modal-nav.prev { left: 14px; }
  .modal-nav.next { right: 14px; }
  .modal-nav[hidden] { display: none; }

  .modal-body {
    padding: 28px 36px 32px;
  }
  .modal-kicker {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #aaa;
    margin-bottom: 8px;
  }
  .modal-title {
    font-family: Garamond, Georgia, serif;
    font-size: 26px;
    font-weight: normal;
    margin: 0 0 14px 0;
    color: #1a1714;
    letter-spacing: 0.02em;
  }
  .modal-caption {
    font-size: 14px;
    line-height: 1.65;
    color: #3a342c;
    margin-bottom: 20px;
  }
  .modal-link {
    display: inline-block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #6a1e1a;
    text-decoration: none;
    border-bottom: 1px solid rgba(106,30,26,0.4);
    padding-bottom: 2px;
    transition: border-color 0.2s;
  }
  .modal-link:hover { border-color: #6a1e1a; }
  .modal-counter {
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #c0b8a8;
    margin-top: 18px;
  }

  @media (max-width: 580px) {
    .main { padding: 50px 18px 40px; }
    h1 { font-size: 30px; }
    .works-tabs { gap: 18px; }
    .works-grid { grid-template-columns: repeat(2, 1fr); gap: 18px; }
    .modal-body { padding: 22px 22px 28px; }
    .modal-title { font-size: 22px; }
  }

  .footer {
    text-align: center;
    padding: 20px;
    font-size: 10px;
    color: #bbb;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-top: 1px solid rgba(0,0,0,0.06);
  }
</style>
</head>
<body>

<div id="chop-nav"></div>
<script src="/js/chop-nav.js"></script>

<div class="main">

  <img src="/assets/deer.jpg" alt="" class="portrait">

  <h1>Julio Avalos</h1>
  <div class="tagline">a modern guy</div>

  <div class="divider"></div>

  <table class="links-table">
    <tr><td>Wikipedia</td><td><a href="https://en.wikipedia.org/wiki/Julio_Avalos">Julio Avalos</a></td></tr>
    <tr><td>LinkedIn</td><td><a href="https://www.linkedin.com/in/julio-avalos-who/">julio-avalos-who</a></td></tr>
    <tr><td>GitHub</td><td><a href="https://github.com/hoolio">hoolio</a></td></tr>
    <tr><td>Observable</td><td><a href="https://observablehq.com">observablehq.com</a></td></tr>
    <tr><td>Email</td><td><a href="mailto:chopradio@gmail.com">chopradio@gmail.com</a></td></tr>
    <tr class="works-row">
      <td>Works</td>
      <td>
        <button class="works-toggle" id="worksToggle" aria-expanded="false" aria-controls="worksPanel">
          selected projects and writings <span class="chev" aria-hidden="true">▾</span>
        </button>
      </td>
    </tr>
  </table>

</div>

<section class="works" id="worksPanel" aria-hidden="true">
  <div class="works-inner">
    <div class="works-tabs" role="tablist">
      <button class="works-tab active" role="tab" data-tab="work">Work</button>
      <button class="works-tab" role="tab" data-tab="writings">Writings</button>
      <button class="works-tab" role="tab" data-tab="interviews">Interviews</button>
      <button class="works-tab" role="tab" data-tab="sounds">Sounds</button>
    </div>
    <div class="works-grid" id="worksGrid"></div>
  </div>
</section>

<div class="footer">
  Choplogic Radio &middot; Est. 2006
</div>

<!-- Modal -->
<div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal" role="document">
    <button class="modal-close" id="modalClose" aria-label="Close">×</button>
    <div class="modal-image-wrap" id="modalImageWrap">
      <button class="modal-nav prev" id="modalPrev" aria-label="Previous">‹</button>
      <button class="modal-nav next" id="modalNext" aria-label="Next">›</button>
    </div>
    <div class="modal-body">
      <div class="modal-kicker" id="modalKicker"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-caption" id="modalCaption"></p>
      <a class="modal-link" id="modalLink" href="#" target="_blank" rel="noopener">Visit →</a>
      <div class="modal-counter" id="modalCounter"></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // -------- SVG art library --------
  // Each entry is a self-contained SVG with paper background, oxblood accents.
  // viewBox 200x250 (4:5) for thumbnails; scales to fill modal letterboxed.
  const ART = {
    hedcut: `
      <svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="hc-bw" x="0" y="0">
            <feColorMatrix type="matrix" values="0.299 0.587 0.114 0 0
                                                  0.299 0.587 0.114 0 0
                                                  0.299 0.587 0.114 0 0
                                                  0 0 0 1 0"/>
            <feComponentTransfer>
              <feFuncR type="discrete" tableValues="0 0.25 0.55 0.85 1"/>
              <feFuncG type="discrete" tableValues="0 0.25 0.55 0.85 1"/>

            </feComponentTransfer>
          </filter>
          <pattern id="hc-dots" patternUnits="userSpaceOnUse" width="3.5" height="3.5">
            <circle cx="1.75" cy="1.75" r="0.65" fill="#1a1714"/>
          </pattern>
        </defs>
        <rect width="200" height="250" fill="#f3ede1"/>
        <g style="mix-blend-mode:multiply">
          <image href="/assets/deer.jpg" x="20" y="22" width="160" height="180" filter="url(#hc-bw)" preserveAspectRatio="xMidYMid slice"/>
          <rect x="20" y="22" width="160" height="180" fill="url(#hc-dots)" opacity="0.55"/>
        </g>
        <line x1="20" y1="216" x2="180" y2="216" stroke="#1a1714" stroke-width="0.8"/>

      </svg>
    `,
    hypergrowth: `
      <svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
        <rect width="200" height="250" fill="#f3ede1"/>
        <g stroke="#d4cab2" stroke-width="0.6">
          <line x1="28" y1="200" x2="180" y2="200"/>
          <line x1="28" y1="60" x2="28" y2="200"/>
          <line x1="28" y1="160" x2="180" y2="160" stroke-dasharray="2,3"/>
          <line x1="28" y1="120" x2="180" y2="120" stroke-dasharray="2,3"/>

        </g>
        <path d="M 30 196 Q 65 192 92 178 T 138 128 Q 158 96 175 50"

        <circle cx="175" cy="50" r="3.6" fill="#6a1e1a"/>
        <circle cx="175" cy="50" r="7" fill="none" stroke="#6a1e1a" stroke-width="0.9" opacity="0.4"/>
        <text x="28" y="225" font-family="IBM Plex Sans, sans-serif" font-size="9" letter-spacing="2" fill="#a89c80">↗ HYPERGROWTH</text>
      </svg>
    `,
    onair: `
      <svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
        <rect width="200" height="250" fill="#f3ede1"/>
        <rect x="28" y="56" width="144" height="108" rx="5" fill="none" stroke="#1a1714" stroke-width="1.5"/>
        <g stroke="#d4cab2" stroke-width="0.4">
          <line x1="28" y1="72" x2="172" y2="72"/>
          <line x1="28" y1="84" x2="172" y2="84"/>
          <line x1="28" y1="148" x2="172" y2="148"/>
          <line x1="28" y1="160" x2="172" y2="160"/>
        </g>
        <rect x="56" y="92" width="88" height="34" fill="#6a1e1a"/>
        <text x="100" y="115" text-anchor="middle" fill="#f9f6f0" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="700" letter-spacing="3.5">ON AIR</text>
        <rect x="93" y="164" width="14" height="6" fill="#1a1714"/>
        <rect x="78" y="170" width="44" height="3" fill="#1a1714"/>
        <text x="100" y="206" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" letter-spacing="2" fill="#a89c80">BROADCAST · MSNBC</text>
      </svg>
    `,
    waveform: `
      <svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
        <rect width="200" height="250" fill="#f3ede1"/>
        <g fill="#6a1e1a">
          ${[10,16,24,18,30,42,28,50,36,22,14,26,38,48,32,20,12,28,36,44,30,18,22,14,8]
            .map((h, i) => {

  // -------- Toggle gallery --------
  const toggle = document.getElementById('worksToggle');
  const panel = document.getElementById('worksPanel');
  toggle.addEventListener('click', () => {
    const open = panel.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    panel.setAttribute('aria-hidden', open ? 'false' : 'true');
    if (open) {
      setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
    }
  });

  // -------- Render grid --------
  const grid = document.getElementById('worksGrid');
  function renderTab(name) {
    const items = WORKS[name] || [];
    grid.innerHTML = items.map((item, i) => {
      const isLogo = !!item.logo;
      const thumbInner = isLogo ? renderLogoThumb(item) : renderThumb(item);
      const thumbClass = isLogo ? 'work-thumb logo-thumb' : 'work-thumb';
      return `
        <button class="work-card" data-tab="${name}" data-index="${i}" aria-label="${item.title}">
          <div class="${thumbClass}">${thumbInner}</div>
          <div class="work-meta">
            <span class="wm-title">${item.title}</span>
            <span class="wm-sub">${item.sub || ''}</span>
          </div>
        </button>
      `;
    }).join('');
  }
  function renderThumb(item) {
    const first = (item.slides && item.slides[0]) || item;
    if (first.image) {
      return `<img src="${first.image}" alt="${item.title}">`;
    }
    if (item.art && ART[item.art]) {
      return `<div class="art-thumb">${ART[item.art]}</div>`;
    }
    const ph = first.placeholder || item.placeholder || { title: item.title };
    return `
      <div class="placeholder">
        ${ph.kicker ? `<div class="ph-kicker">${ph.kicker}</div>` : ''}
        <div class="ph-title">${ph.title || item.title}</div>
        <div class="ph-rule"></div>
        ${ph.meta ? `<div class="ph-meta">${ph.meta}</div>` : ''}
      </div>
    `;
  }
  function renderLogoThumb(item) {
    const mask = `-webkit-mask-image:url('${item.logo}');mask-image:url('${item.logo}');`;
    return `
      <div class="logo-mark" style="${mask}"></div>
      ${item.logoMeta ? `<div class="logo-meta">${item.logoMeta}</div>` : ''}
    `;
  }

  // tab switching
  function activateTab(name) {
    const btn = document.querySelector(`.works-tab[data-tab="${name}"]`);
    if (!btn) return false;
    document.querySelectorAll('.works-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTab(name);
    return true;
  }
  document.querySelectorAll('.works-tab').forEach(btn => {
    btn.addEventListener('click', () => activateTab(btn.dataset.tab));
  });
  activateTab('work');

  // -------- Hash routing (open works panel + activate tab) --------
  const VALID_HASH = ['sounds', 'writings', 'interviews', 'work'];
  function applyHash() {
    const name = (location.hash || '').replace('#', '');
    if (!VALID_HASH.includes(name)) return;
    if (!panel.classList.contains('open')) {
      panel.classList.add('open');
      toggle.setAttribute('aria-expanded', 'true');
      panel.setAttribute('aria-hidden', 'false');
    }
    activateTab(name);
    setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
  }
  window.addEventListener('hashchange', applyHash);
  applyHash();

  // -------- Modal --------
  const modal = document.getElementById('modal');
  const modalClose = document.getElementById('modalClose');
  const modalImageWrap = document.getElementById('modalImageWrap');
  const modalPrev = document.getElementById('modalPrev');
  const modalNext = document.getElementById('modalNext');
  const modalKicker = document.getElementById('modalKicker');
  const modalTitle = document.getElementById('modalTitle');
  const modalCaption = document.getElementById('modalCaption');
  const modalLink = document.getElementById('modalLink');
  const modalCounter = document.getElementById('modalCounter');

  let current = null; // { item, slideIdx }

  function openModal(item) {
    current = { item, slideIdx: 0 };
    modalKicker.textContent = item.kicker || '';
    modalTitle.textContent = item.title;
    modalCaption.textContent = item.caption || '';
    modalLink.textContent = item.linkLabel || 'Visit →';
    modalLink.href = item.link || '#';
    if (item.link && item.link.startsWith('http')) {
      modalLink.target = '_blank';
    } else {
      modalLink.removeAttribute('target');
    }
    renderSlide();
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function renderSlide() {
    if (!current) return;
    const { item, slideIdx } = current;
    const slides = item.slides || [item];
    const slide = slides[slideIdx];
    // remove existing content, keep nav buttons
    Array.from(modalImageWrap.querySelectorAll('img, .placeholder, .modal-logo, .modal-art')).forEach(n => n.remove());
    modalImageWrap.classList.remove('art-mode');
    let node;
    if (slide.image) {
      node = document.createElement('img');
      node.src = slide.image;
      node.alt = slide.alt || item.title;
    } else if (item.art && ART[item.art] && slide === item) {
      node = document.createElement('div');
      node.className = 'modal-art';
      node.innerHTML = ART[item.art];
      modalImageWrap.classList.add('art-mode');
    } else if (item.logo && slide === item) {
      node = document.createElement('div');
      node.className = 'placeholder modal-logo';
      node.innerHTML = `
        <div class="logo-mark" style="-webkit-mask-image:url('${item.logo}');mask-image:url('${item.logo}');"></div>
        ${item.kicker ? `<div class="ph-kicker" style="margin-top:22px">${item.kicker}</div>` : ''}
      `;
    } else {
      const ph = slide.placeholder || item.placeholder || { title: item.title };
      node = document.createElement('div');
      node.className = 'placeholder';
      node.innerHTML = `
        ${ph.kicker ? `<div class="ph-kicker">${ph.kicker}</div>` : ''}
        <div class="ph-title">${ph.title || item.title}</div>
        <div class="ph-rule"></div>
        ${ph.meta ? `<div class="ph-meta">${ph.meta}</div>` : ''}
      `;
    }
    modalImageWrap.insertBefore(node, modalPrev);
    const multi = slides.length > 1;
    modalPrev.hidden = !multi;
    modalNext.hidden = !multi;
    modalCounter.textContent = multi ? `${slideIdx + 1} / ${slides.length}` : '';
  }
  function closeModal() {
    modal.classList.remove('open');
    document.body.style.overflow = '';
    current = null;
  }
  function step(delta) {
    if (!current) return;
    const slides = current.item.slides || [current.item];
    current.slideIdx = (current.slideIdx + delta + slides.length) % slides.length;
    renderSlide();
  }

  grid.addEventListener('click', (e) => {
    const card = e.target.closest('.work-card');
    if (!card) return;
    const tab = card.dataset.tab;
    const idx = parseInt(card.dataset.index, 10);
    const item = WORKS[tab][idx];
    if (item) openModal(item);
  });

  modalClose.addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
  modalPrev.addEventListener('click', (e) => { e.stopPropagation(); step(-1); });
  modalNext.addEventListener('click', (e) => { e.stopPropagation(); step(1); });
  document.addEventListener('keydown', (e) => {
    if (!modal.classList.contains('open')) return;
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
})();
