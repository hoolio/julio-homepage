<!DOCTYPE html>
<html>
<head>
<title>About — Choplogic Radio</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background: #f9f6f0;
    color: #1a1714;
    font-family: calibri, arial, geneva, helvetica, sans-serif;
    margin: 0;
    padding: 0;
    font-size: 14px;
    line-height: 1.6;
  }

  /* Photographic grain — like aged silver gelatin */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 180px 180px;
  }

  a { color: #333; }
  a:hover { color: #800000; }

  .nav {
    padding: 16px 20px;
    font-size: 11px;
    letter-spacing: 0.06em;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .nav a {
    color: #999;
    text-decoration: none;
    margin-right: 18px;
    text-transform: uppercase;
  }
  .nav a:hover { color: #1a1714; }
  .nav a.active { color: #1a1714; }

  .main {
    max-width: 600px;
    margin: 0 auto;
    padding: 80px 20px 60px;
    text-align: center;
  }

  .portrait {
    width: 200px;
    height: auto;
    margin-bottom: 40px;
    filter: contrast(1.05) brightness(1.02);
    mix-blend-mode: multiply;
  }

  h1 {
    font-family: Garamond, Georgia, serif;
    font-size: 36px;
    font-weight: normal;
    letter-spacing: 0.04em;
    margin: 0 0 12px 0;
    color: #1a1714;
  }

  .tagline {
    font-family: Garamond, Georgia, serif;
    font-size: 16px;
    font-weight: normal;
    font-style: italic;
    color: #888;
    margin-bottom: 50px;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: #ccc;
    margin: 0 auto 40px;
  }

  .links-table {
    width: 100%;
    max-width: 420px;
    margin: 0 auto 50px;
    border-collapse: collapse;
    text-align: left;
  }

  .links-table td {
    padding: 8px 0;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    font-size: 13px;
  }

  .links-table td:first-child {
    width: 100px;
    color: #aaa;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    vertical-align: top;
    padding-top: 10px;
  }

  .links-table a {
    color: #1a1714;
    text-decoration: none;
    border-bottom: 1px solid rgba(0,0,0,0.1);
    transition: border-color 0.2s;
  }

  .links-table a:hover {
    border-color: #800000;
    color: #800000;
  }

  .footer {
    text-align: center;
    padding: 20px;
    font-size: 10px;
    color: #bbb;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-top: 1px solid rgba(0,0,0,0.06);
  }
</style>
</head>
<body>

<div class="nav">
  <a href="/">choplogic radio</a>
  <a href="/home/">home</a>
  <a href="/about/" class="active">About</a>
</div>

<div class="main">

  <img src="/assets/deer.jpg" alt="" class="portrait">

  <h1>Julio Avalos</h1>
  <div class="tagline">Chop is hosted by Julio. He plays music.</div>

  <div class="divider"></div>

  <table class="links-table">
    <tr><td>Wikipedia</td><td><a href="https://en.wikipedia.org/wiki/Julio_Avalos">Julio Avalos</a></td></tr>
    <tr><td>LinkedIn</td><td><a href="https://www.linkedin.com/in/julio-avalos-who/">julio-avalos-who</a></td></tr>
    <tr><td>Observable</td><td><a href="https://observablehq.com">observablehq.com</a></td></tr>
    <tr><td>GitHub</td><td><a href="https://github.com/hoolio">hoolio</a></td></tr>
    <tr><td>Shades News</td><td><a href="https://shadesnews.com">shadesnews.com</a></td></tr>
    <tr><td>Email</td><td><a href="mailto:chopradio@gmail.com">chopradio@gmail.com</a></td></tr>
  </table>

</div>

<div class="footer">
  Choplogic Radio &middot; Est. 2006
</div>

<script src="/js/chop-radio-player.js"></script>
</body>
</html>
