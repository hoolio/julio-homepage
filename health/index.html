<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Syne:wght@400;500;600;700&family=Azeret+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #f2ece0;
  --bg2:     #ede6d6;
  --bg3:     #e8e0cc;
  --ink:     #1a1714;
  --dim:     rgba(26,23,20,0.5);
  --dimmer:  rgba(26,23,20,0.28);
  --sage:    #4a7a68;
  --sage-lo: rgba(74,122,104,0.08);
  --sage-mid:rgba(74,122,104,0.15);
  --amber:   #a0691e;
  --amber-bg:#c97d22;
  --amber-lo:rgba(160,105,30,0.08);
  --rule:    rgba(26,23,20,0.1);
  --rule-hi: rgba(26,23,20,0.18);
  --red:     #8b3a2a;
  --red-lo:  rgba(139,58,42,0.08);
}

html { background: var(--bg); color: var(--ink); font-family: 'Syne', sans-serif; }

body::before {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none; z-index: 200;
  opacity: 0.05;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 150px 150px;
}

/* LAYOUT */
.page {
  /* rail is position:fixed — no grid needed */
}

/* RAIL */
.rail {
  position: fixed;
  top: 0; left: 0; bottom: 0; width: 200px;
  border-right: 1px solid var(--rule);
  display: flex; flex-direction: column;
  justify-content: space-between;
  padding: 2rem 0; z-index: 50;
  background: rgba(242,236,224,0.9);
  backdrop-filter: blur(10px);
}

.rail-name {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  transform: rotate(180deg);
  font-family: 'Cormorant', serif;
  font-weight: 300; font-size: 1.4rem;
  letter-spacing: 0.24em; color: var(--ink);
  text-transform: uppercase;
  padding: 0 1.75rem; flex: 1;
  display: flex; align-items: center;
}

.rail-nav { padding: 0 1.75rem; display: flex; flex-direction: column; gap: 0.05rem; }

.rail-nav a {
  font-size: 0.6rem; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--dim); text-decoration: none;
  padding: 0.45rem 0;
  display: flex; align-items: center; gap: 0.7rem;
  transition: color 0.2s;
}
.rail-nav a::before {
  content: ''; width: 14px; height: 1px;
  background: currentColor; flex-shrink: 0;
  transition: width 0.25s;
}
.rail-nav a.active { color: var(--sage); }
.rail-nav a.active::before { width: 26px; }
.rail-nav a:hover { color: var(--sage); }

.rail-bottom { padding: 0 1.75rem; display: flex; flex-direction: column; gap: 0.55rem; }
.rail-social {
  font-family: 'Azeret Mono', monospace;
  font-size: 0.57rem; font-weight: 300;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--dimmer); text-decoration: none; transition: color 0.2s;
}
.rail-social:hover { color: var(--ink); }

/* MAIN */
.main { margin-left: 200px; width: calc(100% - 200px); min-width: 0; }

/* PAGE HEADER */
.page-header {
  padding: 3rem 4rem 2rem;
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: baseline;
  justify-content: space-between;
}

.page-title {
  font-family: 'Cormorant', serif;
  font-weight: 300; font-size: 2.8rem;
  letter-spacing: -0.01em; color: var(--ink);
}

.page-date {
  font-family: 'Azeret Mono', monospace;
  font-size: 0.6rem; font-weight: 300;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--dimmer);
}

/* INPUT ZONE */
.input-zone {
  padding: 2.5rem 4rem;
  border-bottom: 1px solid var(--rule);
  background: var(--bg2);
}

.input-zone-label {
  font-family: 'Azeret Mono', monospace;
  font-size: 0.57rem; font-weight: 400;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--sage); margin-bottom: 1rem;
}

.log-textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--rule-hi);
  border-radius: 2px;
  padding: 1.1rem 1.25rem;
  font-family: 'Cormorant', serif;
  font-size: 1.15rem;
  font-weight: 300;
  line-height: 1.6;
  color: var(--ink);
  resize: none;
  min-height: 100px;
  transition: border-color 0.2s;
  outline: none;
}

.log-textarea::placeholder {
  color: var(--dimmer);
  font-style: italic;
}

.log-textarea:focus { border-color: var(--sage); }

/* PHOTO INPUTS */
.photo-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-top: 1rem;
}

.photo-zone {
  border: 1px dashed var(--rule-hi);
  border-radius: 2px;
  background: var(--bg);
  padding: 1.1rem 1.25rem;
  display: flex;
  align-items: center;
  gap: 0.85rem;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  position: relative;
  overflow: hidden;
}

.photo-zone:hover {
  border-color: var(--sage);
  background: var(--sage-lo);
}

.photo-zone input[type="file"] {
  position: absolute; inset: 0;
  opacity: 0; cursor: pointer; width: 100%; height: 100%;
}

.photo-plus {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid var(--rule-hi);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; color: var(--dim);
  flex-shrink: 0;
  transition: border-color 0.2s, color 0.2s;
}

.photo-zone:hover .photo-plus {
  border-color: var(--sage); color: var(--sage);
}

.photo-zone-info {}

.photo-zone-title {
  font-size: 0.7rem; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink); margin-bottom: 0.2rem;
}

.photo-zone-sub {
  font-family: 'Azeret Mono', monospace;
  font-size: 0.57rem; font-weight: 300;
  letter-spacing: 0.1em; color: var(--dimmer);
}

/* preview thumbnail */
.photo-preview {
  width: 36px; height: 36px;
  border-radius: 2px;
  object-fit: cover;
  margin-left: auto;
  flex-shrink: 0;
  border: 1px solid var(--rule);
}

/* SUBMIT */
.submit-row {
  margin-top: 1rem;
  display: flex; align-items: center;
  justify-content: space-between;
}

.submit-btn {
  font-family: 'Azeret Mono', monospace;
  font-size: 0.62rem; font-weight: 500;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: #fff;
  background: var(--sage);
  border: none; border-radius: 2px;
  padding: 0.65rem 1.5rem;
  cursor: pointer;
  transition: background 0.2s, letter-spacing 0.2s;
}
.submit-btn:hover { background: #3d6657; letter-spacing: 0.24em; }
.submit-btn:disabled { background: var(--dimmer); cursor: not-allowed; letter-spacing: 0.18em; }

.submit-hint {
  font-family: 'Azeret Mono', monospace;
  font-size: 0.55rem; font-weight: 300;
  letter-spacing: 0.1em; color: var(--dimmer);
}

/* PARSING RESULT */
.parse-result {
  display: none;
  margin-top: 1.25rem;
  border: 1px solid var(--rule);
  border-radius: 2px;
  overflow: hidden;
}

.parse-result.visible { display: block; }

.parse-col {
  padding: 1.1rem 1.25rem;
  background: var(--bg);
}

.parse-col + .parse-col {
  border-top: 1px solid var(--rule);
}

.parse-col-label {
  font-family: 'Azeret Mono', monospace;
  font-size: 0.55rem; font-weight: 500;
  letter-spacing: 0.18em; text-transform: uppercase;
  margin-bottom: 0.6rem;
}

.parse-col.activity .parse-col-label { color: var(--sage); }
.parse-col.food .parse-col-label { color: var(--amber); }

.parse-item {
  display: flex; align-items: baseline;
  gap: 0.75rem; padding: 0.3rem 0;
  border-bottom: 1px solid var(--rule);
  font-size: 0.82rem; color: var(--dim);
}
.parse-item:last-child { border-bottom: none; }

.parse-item-name { flex: 1; font-weight: 500; color: var(--ink); font-size: 0.82rem; }
.parse-item-detail {
  font-family: 'Azeret Mono', monospace;
  font-size: 0.58rem; font-weight: 300;
  color: var(--dimmer); letter-spacing: 0.06em;
}

/* SPINNER */
.spinner {
  display: none;
  width: 14px; height: 14px;
  border: 1.5px solid var(--rule-hi);
  border-top-color: var(--sage);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin-left: 0.75rem;
}
.spinner.visible { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* HISTORY */
.history { padding: 0 4rem 4rem; }

.history-header {
  display: flex; align-items: baseline;
  justify-content: space-between;
  padding: 2rem 0 1.5rem;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 0;
}

.history-title {
  font-family: 'Azeret Mono', monospace;
  font-size: 0.57rem; font-weight: 400;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--sage);
}

.history-count {
  font-family: 'Azeret Mono', monospace;
  font-size: 0.55rem; font-weight: 300;
  letter-spacing: 0.12em; color: var(--dimmer);
}

/* ENTRY */
.entry {
  border-bottom: 1px solid var(--rule);
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 0;
}

.entry-date-col {
  padding: 2rem 1.5rem 2rem 0;
  border-right: 1px solid var(--rule);
  display: flex; flex-direction: column;
  gap: 0.5rem;
}

.entry-dow {
  font-family: 'Cormorant', serif;
  font-weight: 300; font-style: italic;
  font-size: 0.9rem; color: var(--dim);
}

.entry-date-num {
  font-family: 'Cormorant', serif;
  font-weight: 300; font-size: 2rem;
  line-height: 1; color: var(--ink);
}

.entry-month {
  font-family: 'Azeret Mono', monospace;
  font-size: 0.55rem; font-weight: 300;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--dimmer);
}

.entry-thumb {
  width: 44px; height: 44px;
  border-radius: 2px; object-fit: cover;
  border: 1px solid var(--rule);
  margin-top: 0.75rem;
}

.entry-body { padding: 2rem 0 2rem 2rem; }

.entry-raw {
  font-family: 'Cormorant', serif;
  font-size: 1.05rem; font-weight: 300;
  font-style: italic; color: var(--dim);
  line-height: 1.5; margin-bottom: 1.25rem;
  max-width: 540px;
}

.entry-tags {
  display: flex; flex-wrap: wrap; gap: 0.5rem;
  margin-bottom: 1rem;
}

.tag {
  font-family: 'Azeret Mono', monospace;
  font-size: 0.55rem; font-weight: 400;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 0.22rem 0.6rem; border-radius: 2px;
}

.tag.activity { background: var(--sage-lo); color: var(--sage); }
.tag.food     { background: var(--amber-lo); color: var(--amber); }
.tag.photo    { background: rgba(26,23,20,0.05); color: var(--dimmer); }

.entry-metrics {
  display: flex; gap: 2rem; flex-wrap: wrap;
}

.metric-label {
  font-family: 'Azeret Mono', monospace;
  font-size: 0.52rem; font-weight: 300;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--dimmer); margin-bottom: 0.2rem;
}

.metric-value {
  font-family: 'Cormorant', serif;
  font-size: 1rem; font-weight: 400; color: var(--ink);
}

/* food photos strip */
.food-photos {
  display: flex; gap: 0.5rem; margin-top: 0.75rem;
}

.food-photo {
  width: 52px; height: 52px;
  border-radius: 2px; object-fit: cover;
  border: 1px solid var(--rule);
}
</style>
</head>
<body>

<div class="page">

  <!-- RAIL -->
  <aside class="rail">
    <div class="rail-name">Julio Avalos</div>
    <nav class="rail-nav">
      <a href="/">About</a>
      <a href="/#work">Work</a>
      <a href="/radio/">Radio</a>
      <a href="/#press">Press</a>
      <a href="/health/" class="active">Health</a>
    </nav>
    <div class="rail-bottom">
      <a href="https://www.linkedin.com/in/julio-avalos-who/" class="rail-social">LinkedIn</a>
      <a href="https://observablehq.com" class="rail-social">Observable</a>
      <a href="https://github.com/hoolio" class="rail-social">GitHub</a>
      <a href="#" class="rail-social" onclick="promptApiKey();return false" id="settings-link">Settings</a>
    </div>
  </aside>

  <div class="main">

    <!-- PAGE HEADER -->
    <div class="page-header">
      <h1 class="page-title">Health</h1>
      <span class="page-date" id="today-date"></span>
    </div>

    <!-- INPUT ZONE -->
    <div class="input-zone">
      <div class="input-zone-label">Log today</div>

      <textarea
        class="log-textarea"
        id="log-text"
        rows="3"
        placeholder="Ran 4 miles this morning, eggs and avocado for breakfast, grilled salmon bowl for lunch, lifted for 40 minutes..."
      ></textarea>

      <!-- PHOTO INPUTS -->
      <div class="photo-row">
        <div class="photo-zone" id="body-zone">
          <input type="file" accept="image/*" id="body-photo-input" onchange="handlePhoto(event, 'body')">
          <div class="photo-plus" id="body-plus">+</div>
          <div class="photo-zone-info">
            <div class="photo-zone-title">Daily Photo</div>
            <div class="photo-zone-sub">Body check-in</div>
          </div>
          <img class="photo-preview" id="body-preview" style="display:none">
        </div>

        <div class="photo-zone" id="food-zone">
          <input type="file" accept="image/*" multiple id="food-photo-input" onchange="handlePhoto(event, 'food')">
          <div class="photo-plus" id="food-plus">+</div>
          <div class="photo-zone-info">
            <div class="photo-zone-title">Food Photo</div>
            <div class="photo-zone-sub">Claude will analyze it</div>
          </div>
          <img class="photo-preview" id="food-preview" style="display:none">
        </div>
      </div>

      <!-- SUBMIT -->
      <div class="submit-row">
        <div style="display:flex;align-items:center;gap:0.5rem">
          <button class="submit-btn" id="submit-btn" onclick="submitLog()">Parse + Save</button>
          <span class="spinner" id="spinner"></span>
        </div>
        <span class="submit-hint">Claude reads your note and structures it automatically</span>
      </div>

      <!-- PARSE RESULT -->
      <div class="parse-result" id="parse-result">
        <div class="parse-col activity">
          <div class="parse-col-label">Activity</div>
          <div id="activity-items"></div>
        </div>
        <div class="parse-col food">
          <div class="parse-col-label">Food</div>
          <div id="food-items"></div>
        </div>
      </div>
    </div>

    <!-- HISTORY -->
    <div class="history">
      <div class="history-header">
        <span class="history-title">Log history</span>
        <span class="history-count" id="entry-count"></span>
      </div>
      <div id="history-list"></div>
    </div>

  </div>
</div>

<script>
// ─── State ───────────────────────────────────────
const STORAGE_KEY = 'health_entries';
let entries = [];
let bodyPhotoB64 = null;
let foodPhotoB64 = null;

// ─── Init ────────────────────────────────────────
document.getElementById('today-date').textContent =
  new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

(async function init() {
  await migrateEncryptedData();
  loadEntries();
  seedIfEmpty();
  renderHistory();
})();

// ─── Photo handlers ───────────────────────────────
function handlePhoto(e, type) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const b64 = ev.target.result;
    if (type === 'body') {
      bodyPhotoB64 = b64;
      const img = document.getElementById('body-preview');
      img.src = b64; img.style.display = 'block';
      document.getElementById('body-plus').textContent = '✓';
    } else {
      foodPhotoB64 = b64;
      const img = document.getElementById('food-preview');
      img.src = b64; img.style.display = 'block';
      document.getElementById('food-plus').textContent = '✓';
    }
  };
  reader.readAsDataURL(file);
}

// ─── Submit ───────────────────────────────────────
async function submitLog() {
  const text = document.getElementById('log-text').value.trim();
  if (!text && !foodPhotoB64) return;

  const btn = document.getElementById('submit-btn');
  const spinner = document.getElementById('spinner');
  btn.disabled = true;
  spinner.classList.add('visible');

  try {
    const parsed = await parseWithClaude(text, foodPhotoB64);
    showParseResult(parsed);

    const entry = {
      id: Date.now(),
      date: new Date().toISOString(),
      raw: text,
      bodyPhoto: bodyPhotoB64,
      foodPhoto: foodPhotoB64,
      activity: parsed.activity,
      food: parsed.food,
      metrics: parsed.metrics
    };

    entries.unshift(entry);
    saveEntries();
    renderHistory();

    // reset
    document.getElementById('log-text').value = '';
    bodyPhotoB64 = null; foodPhotoB64 = null;
    document.getElementById('body-preview').style.display = 'none';
    document.getElementById('food-preview').style.display = 'none';
    document.getElementById('body-plus').textContent = '+';
    document.getElementById('food-plus').textContent = '+';

  } catch(err) {
    console.error(err);
    alert('Parsing failed — check your API connection.');
  }

  btn.disabled = false;
  spinner.classList.remove('visible');
}

// ─── Claude API ───────────────────────────────────
async function parseWithClaude(text, foodImage) {
  const content = [];

  if (foodImage) {
    content.push({
      type: 'image',
      source: { type: 'base64', media_type: 'image/jpeg', data: foodImage.split(',')[1] }
    });
  }

  const prompt = `Parse this health log entry and return ONLY valid JSON, no other text.

Log: "${text}"
${foodImage ? 'There is also a food photo attached — identify what you see and add it to food.' : ''}

Return this exact structure:
{
  "activity": [
    { "name": "activity name", "detail": "duration or reps or distance" }
  ],
  "food": [
    { "name": "food item or meal", "detail": "estimated calories or portion" }
  ],
  "metrics": {
    "total_calories": "estimated number or null",
    "active_minutes": "number or null",
    "notes": "one short observation or null"
  }
}`;

  content.push({ type: 'text', text: prompt });

  const apiKey = localStorage.getItem('health_api_key');
  if (!apiKey) { promptApiKey(); throw new Error('No API key set'); }

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-5-20250514',
      max_tokens: 1000,
      messages: [{ role: 'user', content }]
    })
  });

  const data = await res.json();
  const raw = data.content.map(b => b.text || '').join('');
  const clean = raw.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

// ─── Show parse result ────────────────────────────
function showParseResult(parsed) {
  const result = document.getElementById('parse-result');
  result.classList.add('visible');

  const actEl = document.getElementById('activity-items');
  actEl.innerHTML = (parsed.activity || []).map(a => `
    <div class="parse-item">
      <span class="parse-item-name">${a.name}</span>
      <span class="parse-item-detail">${a.detail}</span>
    </div>
  `).join('') || '<div class="parse-item"><span class="parse-item-name" style="color:var(--dimmer)">None detected</span></div>';

  const foodEl = document.getElementById('food-items');
  foodEl.innerHTML = (parsed.food || []).map(f => `
    <div class="parse-item">
      <span class="parse-item-name">${f.name}</span>
      <span class="parse-item-detail">${f.detail}</span>
    </div>
  `).join('') || '<div class="parse-item"><span class="parse-item-name" style="color:var(--dimmer)">None detected</span></div>';
}

// ─── History ──────────────────────────────────────
function renderHistory() {
  const list = document.getElementById('history-list');
  const count = document.getElementById('entry-count');
  count.textContent = `${entries.length} entr${entries.length === 1 ? 'y' : 'ies'}`;

  if (!entries.length) {
    list.innerHTML = `<div style="padding:3rem 0; font-family:'Cormorant',serif; font-size:1rem; font-style:italic; color:var(--dimmer);">No entries yet. Log something above.</div>`;
    return;
  }

  list.innerHTML = entries.map(e => {
    const d = new Date(e.date);
    const dow = d.toLocaleDateString('en-US', { weekday:'long' });
    const day = d.getDate();
    const mon = d.toLocaleDateString('en-US', { month:'short' }).toUpperCase();

    const actTags = (e.activity||[]).map(a =>
      `<span class="tag activity">${a.name}</span>`).join('');
    const foodTags = (e.food||[]).map(f =>
      `<span class="tag food">${f.name}</span>`).join('');
    const photoTag = e.bodyPhoto ? `<span class="tag photo">Photo</span>` : '';

    const thumb = e.bodyPhoto
      ? `<img class="entry-thumb" src="${e.bodyPhoto}" alt="check-in">`
      : '';

    const foodPhotos = e.foodPhoto
      ? `<div class="food-photos"><img class="food-photo" src="${e.foodPhoto}" alt="food"></div>`
      : '';

    const metrics = e.metrics ? `
      <div class="entry-metrics">
        ${e.metrics.active_minutes ? `<div><div class="metric-label">Active</div><div class="metric-value">${e.metrics.active_minutes} min</div></div>` : ''}
        ${e.metrics.total_calories ? `<div><div class="metric-label">Calories</div><div class="metric-value">~${e.metrics.total_calories}</div></div>` : ''}
        ${e.metrics.notes ? `<div><div class="metric-label">Note</div><div class="metric-value" style="font-size:0.85rem;font-style:italic;color:var(--dim)">${e.metrics.notes}</div></div>` : ''}
      </div>
    ` : '';

    return `
      <div class="entry">
        <div class="entry-date-col">
          <div class="entry-dow">${dow.slice(0,3)}</div>
          <div class="entry-date-num">${day}</div>
          <div class="entry-month">${mon}</div>
          ${thumb}
        </div>
        <div class="entry-body">
          ${e.raw ? `<p class="entry-raw">"${e.raw}"</p>` : ''}
          <div class="entry-tags">${actTags}${foodTags}${photoTag}</div>
          ${metrics}
          ${foodPhotos}
        </div>
      </div>
    `;
  }).join('');
}

// ─── Persistence ──────────────────────────────────
function saveEntries() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch(e) {}
}

function loadEntries() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // Convert old format (date/food/exercise/etc) to new format (date/raw/activity/food)
      entries = parsed.map(e => {
        if (e.raw !== undefined) return e; // already new format
        // Convert old format entry
        const activity = [];
        if (e.exercise) activity.push({ name: e.exercise.split(';')[0].trim().substring(0, 60), detail: e.exercise });
        const food = [];
        if (e.food) {
          e.food.split(';').forEach(f => {
            const t = f.trim();
            if (t) food.push({ name: t.substring(0, 50), detail: '' });
          });
        }
        return {
          id: new Date(e.date).getTime(),
          date: new Date(e.date + 'T12:00:00').toISOString(),
          raw: [e.food, e.exercise, e.notes].filter(Boolean).join(' | '),
          bodyPhoto: null,
          foodPhoto: null,
          activity,
          food,
          metrics: {
            total_calories: e.notes ? (e.notes.match(/~?([\d,]+)\s*kcal/i)?.[1]?.replace(/,/g,'') || null) : null,
            active_minutes: null,
            notes: [e.sleep_hours ? `Sleep: ${e.sleep_hours}h ${e.sleep_quality||''}` : null, e.hrv ? `HRV: ${e.hrv}` : null, e.rhr ? `RHR: ${e.rhr}` : null, e.energy ? `Energy: ${e.energy}` : null].filter(Boolean).join(' · ') || null,
          }
        };
      });
      entries.sort((a,b) => new Date(b.date) - new Date(a.date));
    }
  } catch(e) { entries = []; }
}

// ─── Migrate encrypted data ──────────────────────
async function migrateEncryptedData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw || !raw.startsWith('enc:')) return; // not encrypted or no data

  const pw = prompt('Your health data is encrypted from before. Enter your password to decrypt and migrate:');
  if (!pw) return;

  try {
    // PBKDF2 + AES-GCM decryption (matching old crypto.js)
    const SALT_KEY = 'health_vault_salt';
    const saltB64 = localStorage.getItem(SALT_KEY);
    if (!saltB64) throw new Error('No salt found');

    const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );

    // Decrypt
    const payload = raw.slice(4); // remove 'enc:'
    const [ivB64, ctB64] = payload.split('.');
    const iv = Uint8Array.from(atob(ivB64), c => c.charCodeAt(0));
    const ct = Uint8Array.from(atob(ctB64), c => c.charCodeAt(0));
    const plainBuffer = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    const decrypted = new TextDecoder().decode(plainBuffer);
    const data = JSON.parse(decrypted);

    // Save as plain JSON
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    console.log(`Migrated ${data.length} encrypted entries`);
  } catch(err) {
    console.error('Decryption failed:', err);
    alert('Wrong password or corrupted data. Old entries could not be decrypted.');
  }
}

function promptApiKey() {

  const key = prompt('Anthropic API key (stored locally only):', current);
  if (key !== null && key.trim()) {
    localStorage.setItem('health_api_key', key.trim());
    document.getElementById('settings-link').textContent = 'Key ✓';
  }
}
